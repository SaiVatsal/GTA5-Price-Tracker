name: Steam GTA V Price Tracker

on:
  schedule:
    # Run every hour at minute 10
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Price Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEAM_COUNTRY: 'in'
        run: node tracker.js

      - name: Commit and Push Price State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_state.json
          if git diff --staged --quiet; then
            echo "No price state change to commit."
          else
            git commit -m "chore(state): update GTA V price state [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
